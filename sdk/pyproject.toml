[project]
name = "relay"
version = "0.1.0"
description = "Modal for hardware you already own: run Python on your own machines."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "cloudpickle>=3.1,<4",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
]

[project.scripts]
relay = "relay.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
